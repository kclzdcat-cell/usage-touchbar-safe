name: Signing self-test (temporary)
on:
  push:
    paths: ['.github/workflows/signing-selftest.yml']
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Generate throwaway cert with the user script (pbcopy -> file)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\ncat > "%s/p12.b64"\n' "$RUNNER_TEMP" > "$RUNNER_TEMP/bin/pbcopy"
          chmod +x "$RUNNER_TEMP/bin/pbcopy"
          PATH="$RUNNER_TEMP/bin:$PATH" bash scripts/make-signing-secret.sh
          wc -c "$RUNNER_TEMP/p12.b64"
      - name: Import and sign twice (two different binaries), compare requirements
        run: |
          note() { echo "::notice::$1: $(echo "$2" | tr '\n' ' ' | cut -c1-400)"; }
          SIGNING_P12=$(cat "$RUNNER_TEMP/p12.b64")
          KC="$RUNNER_TEMP/signing.keychain-db"; KC_PASS="$(uuidgen)"
          echo "$SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          note p12size "$(wc -c < "$RUNNER_TEMP/signing.p12")"
          note create "$(security create-keychain -p "$KC_PASS" "$KC" 2>&1; echo rc=$?)"
          security set-keychain-settings "$KC"
          note unlock "$(security unlock-keychain -p "$KC_PASS" "$KC" 2>&1; echo rc=$?)"
          note import "$(security import "$RUNNER_TEMP/signing.p12" -k "$KC" -P usagetouchbar -T /usr/bin/codesign 2>&1; echo rc=$?)"
          note partition "$(security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" 2>&1 | tail -2; echo rc=$?)"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          note identities "$(security find-identity -p codesigning "$KC" 2>&1)"
          IDENTITY=$(security find-certificate -c "UsageTouchBar Signing" -Z "$KC" | awk '/SHA-1 hash:/ { print $3; exit }')
          note identity "$IDENTITY"
          for v in 1 2; do
            APP="T$v.app"; mkdir -p "$APP/Contents/MacOS"
            cp /bin/echo "$APP/Contents/MacOS/usage-touchbar"; chmod u+w "$APP/Contents/MacOS/usage-touchbar"
            printf "v$v" >> "$APP/Contents/MacOS/usage-touchbar"
            cp Info.plist "$APP/Contents/Info.plist"
            note "sign$v-bin" "$(codesign --force --options runtime --identifier local.usage-touchbar --sign "$IDENTITY" "$APP/Contents/MacOS/usage-touchbar" 2>&1; echo rc=$?)"
            note "sign$v-app" "$(codesign --force --options runtime --identifier local.usage-touchbar --sign "$IDENTITY" "$APP" 2>&1; echo rc=$?)"
            note "verify$v" "$(codesign --verify --verbose "$APP" 2>&1; echo rc=$?)"
            codesign -d -r- "$APP" 2>&1 | grep designated > "dr$v.txt"
            note "dr$v" "$(cat dr$v.txt)"
            note "cdhash$v" "$(codesign -dvvv "$APP" 2>&1 | grep -E 'CDHash=|Authority')"
          done
          if diff dr1.txt dr2.txt && [ -s dr1.txt ]; then note result SAME_REQUIREMENT_OK; else echo "::error::requirements differ or empty"; exit 1; fi
